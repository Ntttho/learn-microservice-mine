spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          routes:
            -  id: order-route
               uri: lb:/order-service
               predicates:
                 - Path=/api/order**, /api/order
            -  id: lb:/prodcut-route
               uri: lb:/product-service
               predicates:
                - Path=/api/product, /api/product/**