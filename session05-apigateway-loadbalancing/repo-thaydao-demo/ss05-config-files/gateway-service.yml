server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      routes:
        - id: category-route
          uri: lb://category-service
          predicates:
            - Path=/api/greeting/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE