spring:
  application:
    name: category-service
  config:
    import: optional:configserver:http://localhost:8888

server:
#  port: 9000
  port: ${PORT}

eureka:
  instance:
    prefer-ip-address: true
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: refresh, health # allow call /actuator/refresh
