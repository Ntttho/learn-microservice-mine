spring:
  application:
    name: eureka-server
  cloud:
    config:
      allow-override: true
      server:
        git:
          uri: https://github.com/Ntttho/learn-microservice-mine
          default-label: main
          clone-on-start: true
          search-paths: session03/config/config-repo

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false