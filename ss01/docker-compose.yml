version: '3.8'
networks:
  infra-net:
    driver: bridge
# khởi tạo kho lưu trữ chung: dành cho kafka_data và redis_data
volumes:
  kafka_data:
  redis_data:
services:
  redis:
    image: redis:7.2-alpine
    container_name: local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "default_pass_of_your_choice"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "default_pass_of_your_choice", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: local-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment: # các biến môi trường định nghĩa vào container
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'Mk3OEYBSD3Tsfw5LILxXkg==' # Unique ID for Kafka KRaft Cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M